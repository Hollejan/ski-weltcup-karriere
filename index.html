<!DOCTYPE html>
<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Ski-Weltcup-Karriere</title>
<style>
:root{--bg:#0c1622;--panel:#13202f;--panel2:#182a3d;--line:#24394f;--txt:#e8eef5;--mut:#8ea3b8;--acc:#e63946;--ice:#7cc6fe;--gold:#f4c430;--silver:#c9d1d9;--bronze:#d08a4c;--ok:#4fd18b;--bad:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -100px,#1d3550 0,transparent 70%),var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px}h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ice)}.btn.pri{background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1f00;font-weight:700}
.btn.ghost{background:none}.btn:disabled{opacity:.4;cursor:default}.btn.sm{padding:5px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--txt);border-color:var(--ice)}
main{padding:16px 20px 40px;max-width:1300px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid,.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px}.card h3{margin:14px 0 6px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cal{max-height:72vh;overflow:auto;padding:0}
.cal .row{display:grid;grid-template-columns:28px 52px 1fr 40px;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.cal .row:hover{background:var(--panel2)}.cal .row.sel{background:#1f3a55}
.cal .row .v{color:var(--mut)}.cal .row.done .v{color:var(--txt)}.cal .row .n{color:var(--mut);font-size:12px}
.cal .row .w{grid-column:3/5;font-size:12px;color:var(--mut)}.cal .wm{background:linear-gradient(90deg,#3b2b05,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;text-align:center}
.DH{background:#5a1e24;color:#ffb3ba}.SG{background:#5a3b14;color:#ffd59a}.GS{background:#15405a;color:#a9dcff}.SL{background:#1e4a32;color:#a7f0c6}.WM{background:#5a4a05;color:var(--gold)}
.real{font-size:10px;background:var(--ok);color:#06210f;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px}
.meb{font-size:10px;background:var(--gold);color:#2a1f00;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.p1 td:first-child{color:var(--gold);font-weight:700}tr.p2 td:first-child{color:var(--silver);font-weight:700}tr.p3 td:first-child{color:var(--bronze);font-weight:700}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--panel2)}
tr.me td{background:rgba(244,196,48,.13)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.scroll{overflow:auto;max-height:68vh}
.hero{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.stat{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{color:var(--mut);font-size:12px}.stat .v{font-size:18px;font-weight:700;margin-top:2px}.stat .s{color:var(--mut);font-size:12px}
.podium{display:flex;gap:10px;align-items:flex-end;margin:6px 0 14px}
.podium div{flex:1;text-align:center;border-radius:10px 10px 0 0;padding:10px 6px;background:var(--panel2)}
.podium .g{height:110px;border-top:3px solid var(--gold)}.podium .s{height:90px;border-top:3px solid var(--silver)}.podium .b{height:75px;border-top:3px solid var(--bronze)}
.podium b{display:block;font-size:14px}.podium span{font-size:12px;color:var(--mut)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mut);cursor:pointer;font:inherit;font-size:13px}
.chip.on{color:#fff;border-color:var(--ice);background:#1f3a55}
.news{font-size:13px}.news div{padding:5px 0;border-bottom:1px dashed var(--line)}
.inj{color:var(--bad);font-size:11px;margin-left:6px}
.wx{font-size:12px;color:var(--mut);font-weight:400}
.live{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.live{grid-template-columns:1fr}}
.finish{font-size:22px;font-weight:700;padding:16px;border-radius:12px;background:var(--panel2);text-align:center;min-height:110px}
.finish.me{outline:2px solid var(--gold)}
.finish .t{font-size:30px;font-variant-numeric:tabular-nums}.finish .d{font-size:16px}.neg{color:var(--ok)}.pos{color:var(--bad)}
.barwrap{background:#0a1520;border-radius:6px;height:8px;overflow:hidden}
.barwrap i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),#fff)}
.barwrap i.f{background:linear-gradient(90deg,#4fd18b,#f4c430,#e63946)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal .card{max-width:620px;width:100%;max-height:88vh;overflow:auto}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
label.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
.rat{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.foot{color:var(--mut);font-size:12px;margin-top:18px;max-width:900px}
.globe{font-size:12px;color:var(--gold)}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;opacity:.45}
.ach div.on{opacity:1;border-color:var(--gold)}.ach b{display:block;font-size:13px}
.shop{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--gold);color:#2a1f00;font-weight:700;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);transform:translateY(120px);transition:.3s;z-index:20;max-width:340px}
.toast.on{transform:none}

main{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
header.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(12,22,34,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.who{display:flex;gap:12px;align-items:center}.avatar{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:12px}
.who .nm{font-weight:700;font-size:16px}.who .sub{color:var(--mut);font-size:12px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;min-width:78px}
.kpis span{display:block;font-size:11px;color:var(--mut)}.kpis b{font-size:15px}
.acts{display:flex;gap:6px}
html{background:var(--bg)}body{min-height:100vh;background-attachment:fixed}
nav{background:transparent;justify-content:flex-start;max-width:1240px;margin:0 auto;padding:10px 20px 0;border:0;gap:6px}
nav button{border:1px solid transparent;border-radius:9px;padding:8px 14px}
nav button.on{background:var(--panel2);border-color:var(--line);color:var(--txt)}
.g2,.g3,.g21{margin-top:16px}.g21{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.g21{grid-template-columns:1fr}.kpis div{min-width:64px}}
.hero-card{background:linear-gradient(135deg,#183553,#13202f 60%)}
.eyebrow{font-size:12px;color:var(--ice);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
h2.big{font-size:22px;margin:2px 0 10px}
.status{padding:9px 12px;border-radius:9px;background:var(--panel2);margin:6px 0 10px;font-weight:600}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.bigres{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0}
.alert{border-color:var(--bad);margin-bottom:16px}
.card.alert h2{color:var(--bad)}
.kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpirow .card span{display:block;color:var(--mut);font-size:12px}.kpirow .card b{font-size:20px}
@media(max-width:900px){.kpirow{grid-template-columns:repeat(2,1fr)}}
.create{max-width:1000px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:900px){.create{grid-template-columns:1fr;margin-top:16px}}
.chip.big{border-radius:12px;padding:10px 14px;text-align:left}
.btn.lg{padding:12px 22px;font-size:16px}
.warn{color:var(--gold)}.small{font-size:12px}.lead{font-size:15px;margin:4px 0}
.barwrap i.f2{background:linear-gradient(90deg,#e63946,#f4c430,#4fd18b)}
.card+.card{margin-top:0}


.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cur{background:rgba(79,209,139,.08);border:1px solid rgba(79,209,139,.35);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:4px}
.cur .btn{justify-self:start}
.cand{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px}
.offer{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}.offer .btn{justify-self:start}
.race-card{border-color:var(--ice);background:linear-gradient(160deg,#1b3a5c,#13202f 70%);margin-bottom:16px}
.secbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.sec{background:var(--panel2);border-radius:9px;padding:7px 8px;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sec span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#0a1520;font-size:11px}
.sec.now{outline:2px solid var(--gold);color:var(--txt)}.sec.done{color:var(--txt)}.sec em{font-style:normal;margin-left:auto;font-weight:700}
.lastsec{padding:9px 12px;border-radius:9px;margin:8px 0}.lastsec.good{background:rgba(79,209,139,.15)}.lastsec.badbg{background:rgba(255,138,138,.14)}.lastsec span{float:right;font-weight:700}
.proj{display:flex;gap:10px;align-items:baseline;margin:8px 0}.proj span{color:var(--mut);font-size:12px}.proj b{font-size:22px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.choice{display:flex;flex-direction:column;gap:3px;text-align:left;border-radius:12px;padding:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font:inherit;cursor:pointer}
.choice b{font-size:16px}.choice span{font-size:12px;color:var(--mut)}
.choice.att{border-color:#e63946}.choice.ctrl{border-color:var(--ice)}.choice.safe{border-color:var(--ok)}
.choice:active{transform:scale(.98)}
@media(max-width:700px){.choices{grid-template-columns:1fr}.choice{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 10px}.choice b{width:100%}.stgrid{grid-template-columns:1fr}.secbar{gap:4px}.sec{font-size:11px;padding:6px}}

body{overflow-x:hidden}
.rat{grid-template-columns:70px 1fr 54px}
.mobonly{display:none}
.bnav{display:none}
.train-card{border-color:var(--gold);background:linear-gradient(135deg,#2f2a10,#13202f 65%);margin-bottom:16px}
.xpline{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--txt);font:inherit;cursor:pointer}
.tbtn:hover{border-color:var(--gold)}.tbtn:disabled{opacity:.4;cursor:default}.tbtn.reg{border-style:dashed}
table{table-layout:auto}
@media(max-width:700px){
  main{padding:12px 10px calc(84px + env(safe-area-inset-bottom))}
  #tabs{display:none}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(12,22,34,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px}
  .bnav button span{font-size:20px;line-height:1}
  .bnav button.on{color:var(--txt);background:var(--panel2)}
  header.top{padding:10px 10px 8px;gap:8px}
  .who{width:100%}.avatar{width:38px;height:38px;font-size:24px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);width:100%;gap:4px}
  .kpis div{min-width:0;padding:4px 6px;border-radius:8px}.kpis span{font-size:10px}.kpis b{font-size:13px}
  .acts{width:100%}.acts .btn{flex:1;padding:11px 8px}
  .hm{display:none!important}
  th,td{white-space:normal;padding:7px 5px;font-size:13px}
  th{font-size:11px}
  .card{padding:12px;border-radius:12px}
  h2.big{font-size:19px}.bigres{font-size:32px}
  .g2,.g3,.g21{gap:12px;margin-top:12px}
  .grid{grid-template-columns:1fr}
  .show-detail .cal{display:none}.show-list .detail{display:none}
  .mobonly{display:inline-block}
  .cal{max-height:none}
  .podium{gap:6px}.podium div{padding:8px 4px}.podium b{font-size:12px}.podium .g{height:96px}.podium .s{height:80px}.podium .b{height:68px}
  .tgrid{grid-template-columns:1fr 1fr}
  .tbtn{padding:10px}
  .subnav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .subnav .chip{flex:0 0 auto}
  .inline .chip,.opt .chip{font-size:13px;padding:6px 10px}
  .row-btn .btn{flex:1}
  .finish .t{font-size:26px}.finish{font-size:18px}
  .live{gap:10px}
  .kpirow{gap:8px}
  .toast{left:12px;right:12px;max-width:none;bottom:calc(84px + env(safe-area-inset-bottom))}
  .create{margin:12px auto;padding:0 10px}
  .news div{font-size:13px}
}

@media(max-width:700px){header.top{position:static}.acts{width:100%}.acts .btn.pri,.acts .btn.gold{flex:1}}

body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-y:none}
</style>
</head>

  if(me&&c.starts[disc]&&me.r[disc]>=60&&available(g,me))pool.push(me);

  if(tr&&tr.spec.includes(a.name))mean+=1.3;

    mean+=lvl('service')*0.45+skiBonus(disc)-(c.skiAdapt||0)*0.08-Math.max(0,c.fat-35)*0.07-(c.rust||0);

function secProb(ctx,k){
  const c=C();const a=BYID[c.id];const{wx,tr}=ctxO(ctx);const name=secNames(ctx)[k];
  const diff=74+(tr.dnf-1)*14+hash(tr.key+name)%7+(ctx.disc==='SL'?2:0);
  const trk=Math.min(3,(c.trk||{})[tr.key]||0);
  const b=0.5+0.035*(a.r[ctx.disc]-diff)+(c.mental-50)*0.004+lvl('mental')*0.03-Math.max(0,c.fat-35)*0.006+trk*0.03*(1+0.5*lvl('video'))-(wx.s-1)*0.5-(c.rust||0)*0.03+(tr.night?(c.mental-50)*0.003:0);

  const t=ctx.mb2.t1+p.t0+p.delta;const arr=ctx.r2.map(x=>x.t);const rk=arr.filter(x=>x<t).length+1;return{rk,gap:arr.length?t-Math.min(...arr):0,t};

function resolveSection(ch,quiet){
  const p=S.pend;if(!p||p.kind!=='run')return;const ctx=p.ctx;const L=p.L;const pr=secProb(ctx,p.k);

  else{const ok=rnd()<pr.pK;d=(ok?-0.001:0.006)*L+n;crash=!ok&&rnd()<0.06;txt=ok?'Sauber gefahren':crash?(ctx.disc==='SL'?'Eingefädelt – aus!':'Sturz!'):'Kleiner Fehler'}
  p.delta+=d;p.hist.push({n:pr.name,ch,txt,d:+d.toFixed(2),crash});p.k++;

  ctx.decs=(ctx.decs||[]).concat(p.hist.map(h=>SECCH[h.ch][0].split(' ')[0]));

    if(dnf)ctx.out.push({id:me,st:ctx.two?'DNF1':'DNF',bib:ctx.mb1.bib});else{ctx.r1.push({id:me,bib:ctx.mb1.bib,t1:p.t0+p.delta});ctx.r1.sort((x,y)=>x.t1-y.t1)}

  }else{

}
function simNext(g,inter){

  const i=nextIdx(g);if(i<0)return -1;
  if(cal(g)[i][3]==='WM'){simWM(g);return i}

function applyReal(fin,real,two){

    r.fin.forEach(x=>{const o=m[x.id]=m[x.id]||{id:x.id,pts:0,w:0,pod:0,d:{DH:0,SG:0,GS:0,SL:0}};o.pts+=x.pts;o.d[c[3]]+=x.pts;if(x.rk===1)o.w++;if(x.rk<=3)o.pod++})});

function nations(g){const m={};standings(g).forEach(o=>{const n=BYID[o.id].nat;m[n]=(m[n]||0)+o.pts});return m}
function doneCount(g){return Object.keys(S[g].res).length}

  const pot=84+Math.pow(rnd(),1.3)*13;const id=g+'me'+Date.now()%100000;
  const a={id,name:nm,nat:CF.nat,r,by:S.season-19,pot:+pot.toFixed(1),me:1};
  S.ath[g].push(a);
  S.career={id,g,money:30000,fat:0,kond:50,mental:50,focus:CF.spec==='speed'?'speed':CF.spec==='tech'?'tech':'GS',risk:'norm',
    starts:{DH:CF.spec!=='tech',SG:CF.spec!=='tech',GS:CF.spec!=='speed',SL:CF.spec!=='speed'},up:{service:0,trainer:0,physio:0},
    kader:'C',stars:clamp(Math.round((pot-83)/2.8+(rnd()-.5)),1,5),ach:{},log:[],seasons:[],medals:[0,0,0],wins:0,pods:0,starts0:0,startSeason:S.season,prev:{},interactive:true,reha:'norm',trk:{},rust:0,reinj:0,xp:20,tlog:[],staff:{},sp:{},offers:[]};
  rebuild();G=g;TAB='home';pickRival();makeOffers();
  clog(`Karrierestart mit 19 Jahren für ${NATNAME[CF.nat]||CF.nat}. Kader: C.`);
  save();render();
}
function clog(t){const c=C();c.log.unshift(`${S.season}/${String(S.season+1).slice(2)} · ${t}`);c.log=c.log.slice(0,80)}
function unlock(k){const c=C();if(c.ach[k])return;c.ach[k]=S.season;c.xp=(c.xp||0)+15;const a=ACH.find(x=>x[0]===k);toast(`🏅 Meilenstein: ${a[1]} (+15 XP)`);clog(`🏅 Meilenstein: ${a[1]} (+15 XP)`)}
let toastT;function toast(t){const e=document.getElementById('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600)}
function careerAfterRace(g,i,res,disc,ctx){
  const c=C();const me=c.id;const x=res.fin.find(f=>f.id===me);const o=res.out.find(f=>f.id===me);const started=!!(x||o);
  const venue=cal(g)[i][1];
  if(ctx&&ctx.notNom&&!started)clog(`${venue} ${DN[disc]}: nicht nominiert – Teamrang ${ctx.notNom.rank}, Quote ${ctx.notNom.q}`);
  const xp=[];
  if(started){
    unlock('start');c.starts0++;
    c.trk=c.trk||{};c.trk[res.tk]=(c.trk[res.tk]||0)+1;
    const tr=track(venue,disc);
    const pf=(disc==='DH'||disc==='SG'?19:15)*(tr.tire||1)*(1.3-c.kond/100)*(1-0.08*lvl('kond'));c.fat=clamp(c.fat+pf,0,100);if(c.skiAdapt)c.skiAdapt--;
    c.rust=Math.max(0,(c.rust||0)*0.75-0.1);c.reinj=Math.max(0,(c.reinj||0)-1);
    const a=BYID[me];a.r[disc]=Math.min(a.pot,a.r[disc]+0.03*ageF(a));
    if(x){xp.push(['Im Ziel',8]);if(x.pts)xp.push([`${x.pts} Weltcuppunkte`,Math.round(x.pts/4)]);if(x.rk<=3)xp.push(['Podest',12]);if(x.rk===1)xp.push(['Sieg',10]);
      const ex=expRank(g,a,disc);if(x.rk<ex-2)xp.push(['Erwartung übertroffen',6])}
    else xp.push([o.st==='DNQ'?'Rennerfahrung (n.q.)':'Rennerfahrung (Ausfall)',o.st==='DNQ'?5:3]);
    const place=x?`${x.rk}. Platz${x.pts?` (+${x.pts} Pkt, +${fmtCHF(PRIZE[x.rk-1]||0)})`:''}`:o.st==='DNQ'?'nicht für 2. Lauf qualifiziert':'Ausfall';
    clog(`${venue} ${DN[disc]}: ${place}${res.dec?` · Taktik: ${res.dec}`:''}`);
    if(x){if(res.two)unlock('run2');if(x.pts)unlock('points');if(x.rk<=15)unlock('top15');if(x.rk<=10)unlock('top10');
      if(x.rk<=10&&res.night)unlock('night');
      if(x.rk<=3){unlock('podium');c.pods++;c.money+=10000;a.pot=Math.min(99,+(a.pot+0.3).toFixed(1));if(c.comebackPending){unlock('comeback');c.comebackPending=0}}
      if(x.rk===1){unlock('win');c.wins++;if(c.wins>=5)unlock('wins5');if(c.wins>=25)unlock('wins25');if(CLASSIC.includes(venue))unlock('classic')}
      c.money+=PRIZE[x.rk-1]||0;
      const sk=c.sp&&c.sp.ski,hd=c.sp&&c.sp.head;
      if(x.rk<=3&&sk&&sk.pod){c.money+=sk.pod;clog(`💶 ${sk.name}-Podestprämie ${fmtCHF(sk.pod)}`)}
      if(hd&&hd.perk==='points'&&x.pts)c.money+=x.pts*hd.perPt;
      if(hd&&hd.perk==='podium'&&x.rk<=3){c.money+=hd.pod;clog(`💶 ${hd.name}-Podestprämie ${fmtCHF(hd.pod)}`)}
      if(hd&&hd.perk==='xp')xp.push([`Sponsor ${hd.name}`,3]);
      if(x.rk<=3&&!c.offerFlag){c.offerFlag=1;makeOffers();toast('📨 Neue Sponsorangebote!')}
      if(isFinal(g,i))unlock('final');}
    if(o&&res.two&&o.st==='DNF2')unlock('run2');
    // Rivalenduell
    if(c.rival&&BYID[c.rival]){const rv=c.rival;const all=res.fin.concat(res.out);const ro=all.find(f=>f.id===rv);
      if(ro){const pos=f=>f.rk?f.rk:f.st==='DNF2'?200:f.st==='DNQ'?100+(ctx&&ctx.r1?ctx.r1.findIndex(y=>y.id===f.id):0):300;
        const mp=pos(x||o),rp=pos(ro);if(!(mp>=200&&rp>=200)&&mp!==rp){c.h2h=c.h2h||{w:0,l:0};c.h2hAll=c.h2hAll||{w:0,l:0};
          if(mp<rp){c.h2h.w++;c.h2hAll.w++;if(x&&x.rk<=10||mp<rp-10)S[g].news.unshift(`⚔️ Duell gewonnen: ${a.name} vor Rivale ${BYID[rv].name}`)}
          else{c.h2h.l++;c.h2hAll.l++}}}}
  }
  careerDay(started,xp,`${venue} · ${DN[disc]}`,gapDays(g,i));
}
function ageF(a){const x=age(a);return x<=21?1.25:x<=24?1.05:x<=27?0.8:x<=30?0.5:0.25}
const INJT=[['Prellung',1,2,0.5,0],['Bänderdehnung',3,6,1.5,0],['Meniskusverletzung',7,12,3,0.8],['Kreuzbandriss',22,32,4.5,2]];
const REHA={kons:['🐢 Konservativ','länger raus, aber kaum Folgeschäden und kein Rückfallrisiko'],norm:['⚖️ Normal','Standard-Reha'],fast:['⚡ Beschleunigt','früher zurück – mehr Rost, Folgeschäden und Rückfallgefahr']};
function injureMe(g,disc,venue){
  const c=C();const speed=disc==='DH'||disc==='SG';const w=speed?[.35,.3,.2,.15]:[.45,.3,.15,.1];
  let r=rnd(),k=0,acc=0;for(;k<3;k++){acc+=w[k];if(r<acc)break}
  if(c.reinj>0&&k<3&&rnd()<.4)k++;
  const t=INJT[k];let n=t[1]+Math.floor(rnd()*(t[2]-t[1]+1));n=Math.max(1,Math.round(n*(1-0.15*lvl('physio'))));
  c.injury={type:t[0],sev:k,total:n,rust:t[3],loss:t[4]};c.reha=c.reha||'norm';S[g].inj[c.id]=n;
  const msg=`🚑 Sturz in ${venue}: ${t[0]} – ca. ${n} Rennen Pause`;clog(msg);toast(msg);
  S[g].news.unshift(`🚑 ${BYID[c.id].name} stürzt in ${venue}: ${t[0]}.`);
}
function onReturn(){
  const c=C();const j=c.injury;const a=BYID[c.id];c.injury=null;
  if(!j){clog('✅ Wieder fit.');return}
  const m=c.reha==='fast'?1.35:c.reha==='kons'?0.65:1;c.rust=+(j.rust*m).toFixed(2);
  if(j.loss){const L=j.loss*(c.reha==='fast'?1.5:c.reha==='kons'?0.4:1);DISC.forEach(d=>{if(a.r[d])a.r[d]=+(a.r[d]-L).toFixed(2)});
    if(L>0.3)clog(`Folgeschaden: −${L.toFixed(1)} in allen Disziplinen`)}
  c.reinj=c.reha==='fast'?6:c.reha==='kons'?0:3;if(j.sev>=2)c.comebackPending=1;
  const msg=`💪 Comeback nach ${j.type}! Noch etwas Rost (−${c.rust.toFixed(1)}), der mit jedem Rennen weniger wird.`;clog(msg);toast('💪 Du bist zurück!');
  S[c.g].news.unshift(`💪 ${a.name} feiert das Comeback.`);
}
function mainDisc(a){return DISC.reduce((b,d)=>a.r[d]>a.r[b]?d:b,'DH')}
function pickRival(){
  const c=C();const me=BYID[c.id];const d=mainDisc(me);
  const cands=ATH[c.g].filter(a=>!a.me&&a.r[d]>=68&&a.id!==c.rival);
  const mx=x=>Math.max(...Object.values(x.r));const sc=x=>Math.abs(mx(x)-(mx(me)+2))+Math.abs(age(x)-age(me))*0.35+(x.nat===me.nat?-0.8:0);
  cands.sort((x,y)=>sc(x)-sc(y));
  if(!cands[0])return;c.rival=cands[0].id;c.h2h={w:0,l:0};
  clog(`⚔️ Neuer Rivale: ${cands[0].name} (${cands[0].nat}, ${age(cands[0])} J.)`);
}
function careerGoal(c){
  const g=c.g;const me=c.id;
  if(c.kader==='C'){let n=0;cal(g).forEach((x,i)=>{const r=S[g].res[i];if(r&&r.fin.some(f=>f.id===me&&f.pts))n++});return{t:'In mindestens 3 Rennen Weltcuppunkte holen',ok:n>=3,p:`${n}/3`}}
  if(c.kader==='B'){const b=Math.min(...DISC.map(d=>{const k=standings(g,d).findIndex(o=>o.id===me);return k<0?99:k+1}));return{t:'In einer Disziplinwertung unter die Top 25 (Finalticket)',ok:b<=25,p:b<99?`bester Rang: ${b}.`:'noch keine Punkte'}}
  const pods=cal(g).filter((x,i)=>{const r=S[g].res[i];return r&&r.fin.some(f=>f.id===me&&f.rk<=3)}).length;
  return{t:'Mindestens ein Podestplatz',ok:pods>=1,p:`${pods} Podest(e)`};
}
function retireCareer(){if(S.pend)resolvePend('ctrl');CF.world='keep';const c=C();clog('Karriereende verkündet.');S.hist.forEach(h=>{});const a=BYID[c.id];
  S.legends=S.legends||[];S.legends.push({name:a.name,nat:a.nat,wins:c.wins,pods:c.pods,seasons:c.seasons.length,medals:c.medals,ach:Object.keys(c.ach).length});

const TINT={light:{n:'Locker',c:5,g:.12,f:3,s:.7},norm:{n:'Normal',c:10,g:.25,f:7,s:1.5},hard:{n:'Intensiv',c:20,g:.45,f:14,s:2.6}};
const TOPT={GS:'🔵 Riesentorlauf',SL:'🟢 Slalom',DH:'🔴 Abfahrt',SG:'🟠 Super-G',kond:'💪 Kondition',mental:'🧠 Mental'};
let TI='norm';
function dnum(md){const[m,d]=md.split('-').map(Number);return Date.UTC(m>=7?2001:2002,m-1,d)/864e5}
function gapDays(g,i){const c=cal(g);const n=c[i+1];return n?Math.max(1,dnum(n[0])-dnum(c[i][0])):7}
function careerDay(started,xp,what,gap=3){
  const c=C();const g=c.g;const hurt=S[g].inj[c.id]>0;
  if(!started){xp=xp.filter(x=>!x[0].startsWith('Training'));xp.push([hurt?'Reha-Tag':'Trainingstag',hurt?4:10])}
  const sum=xp.reduce((n,x)=>n+x[1],0);c.xp=(c.xp||0)+sum;
  const hd=c.sp&&c.sp.head;c.fat=hurt?0:clamp(c.fat-(clamp(2.2*gap,3,16)+(hd&&hd.perk==='fit'?4:0))*(1+0.15*lvl('physio')),0,100);
  c.trainPending={day:!started,hurt,what,xp,sum};
}
function trainGain(opt,int){
  const c=C();const a=BYID[c.id];const T=TINT[int];const tm=(1+0.2*lvl(opt==='GS'||opt==='SL'?'tech':'speed'))*ageF(a)*(c.trainPending&&c.trainPending.day?1.4:1)*(S[c.g].inj[c.id]>0&&DN[opt]?0.3:1);
  if(DN[opt]){const room=Math.max(0,a.pot-a.r[opt]);return T.g*tm*clamp(room/(a.pot-60),0.06,1)}
  const v=opt==='kond'?c.kond:c.mental;return T.s*(1+0.3*lvl(opt==='kond'?'kond':'mental'))*clamp((100-v)/50,0.15,1);
}
function doTrain(opt){
  const c=C();const a=BYID[c.id];const tp=c.trainPending;if(!tp)return;
  if(opt==='reg'){c.fat=clamp(c.fat-18*(1+0.15*lvl('physio')),0,100);c.tlog=[`${tp.what}: 🛌 Regeneration`].concat(c.tlog||[]).slice(0,30);toast('🛌 Erholt – Fitness steigt');}
  else{const T=TINT[TI];if((c.xp||0)<T.c)return;c.xp-=T.c;const gn=trainGain(opt,TI);
    if(DN[opt])a.r[opt]=+Math.min(a.pot,a.r[opt]+gn).toFixed(2);else if(opt==='kond')c.kond=clamp(c.kond+gn,0,100);else c.mental=clamp(c.mental+gn,0,100);
    if(S[c.g].inj[c.id]>0)c.fat=0;else c.fat=clamp(c.fat+T.f*(1-0.08*lvl('kond')),0,100);
    const msg=`${TOPT[opt]} ${T.n}: +${gn.toFixed(2)} (−${T.c} XP)`;c.tlog=[`${tp.what}: ${msg}`].concat(c.tlog||[]).slice(0,30);toast('🏋️ '+msg)}
  c.trainPending=null;save();render();
}
function autoRehab(){const c=C();let n=0;while(S[c.g].inj[c.id]>0&&nextIdx(c.g)>=0&&n<60){if(c.trainPending)doTrainSilent();const r=step();if(r==='pause')break;n++}if(c.trainPending&&S[c.g].inj[c.id]>0)doTrainSilent();save();render()}
function doTrainSilent(){const c=C();const tp=c.trainPending;if(!tp)return;
  if((c.xp||0)>=5){c.xp-=5;c.mental=clamp(c.mental+trainGain('mental','light'),0,100)}c.trainPending=null}

function statusTier(){const c=C();let t={A:3,B:2,C:1}[c.kader];if(c.pods>0)t=Math.min(3,t+1);return t}
function makeOffers(){
  const c=C();const t=statusTier();const fame=1+Math.min(1.5,c.wins*0.05+c.pods*0.02);const offers=[];
  const skis=shuffle(SKI.filter(s=>s[2]<=t&&s[2]>=t-1&&(!c.sp.ski||c.sp.ski.name!==s[0]))).slice(0,3);
  skis.forEach(s=>{const base=Math.round(([0,20000,60000,160000][s[2]]*(0.8+rnd()*0.5)*fame)/1000)*1000;
    offers.push({type:'ski',name:s[0],nat:s[1],tier:s[2],mat:s[3],base,pod:[0,4000,8000,15000][s[2]],years:1+Math.floor(rnd()*3)})});
  const heads=shuffle(HEADS.filter(h=>!c.sp.head||c.sp.head.name!==h[0])).slice(0,2);
  heads.forEach(h=>{const lv={1:15000,2:40000,3:100000}[t];let base=Math.round(lv*(0.8+rnd()*0.4)*fame/1000)*1000;const o={type:'head',name:h[0],perk:h[1],ptxt:h[2],years:1+Math.floor(rnd()*2)};
    if(h[1]==='base')base=Math.round(base*1.6/1000)*1000;if(h[1]==='points')o.perPt=[0,60,120,250][t];if(h[1]==='podium')o.pod=[0,10000,20000,40000][t];o.base=base;offers.push(o)});
  c.offers=offers;
}

function newTalent(g){
  const nat=pick(['AUT','AUT','SUI','SUI','ITA','FRA','NOR','USA','GER','SWE','CAN','SLO']);const P=NAMES[nat];
  let name;do{name=pick(P[g].split(' '))+' '+pick(P.L.split(' '))}while(ATH[g].some(a=>a.name===name));
  const spec=pick(['tech','tech','speed','all','GS','SL']);const b=()=>69+rnd()*7;
  const r={DH:0,SG:0,GS:0,SL:0};
  if(spec==='tech'){r.GS=b();r.SL=b()}else if(spec==='speed'){r.DH=b();r.SG=b()}else if(spec==='all'){DISC.forEach(d=>r[d]=b()-1.5)}else r[spec]=b()+1;
  DISC.forEach(d=>r[d]=+r[d].toFixed(1));
  const pot=Math.min(99,Math.max(...Object.values(r))+4+Math.pow(rnd(),1.6)*18);
  const a={id:g+'n'+(S.nid++),name,nat,r,by:S.season-(18+Math.floor(rnd()*3)),pot:+pot.toFixed(1),rookie:1};
  return a;
}
function develop(a){
  const x=age(a);let lo,hi;
  if(x<=21){lo=1.5;hi=5}else if(x<=24){lo=0.5;hi=3}else if(x<=27){lo=-0.3;hi=1.5}else if(x<=30){lo=-0.8;hi=0.8}else if(x<=32){lo=-1.8;hi=0.3}else if(x<=34){lo=-2.8;hi=-0.4}else{lo=-4;hi=-1.2}
  DISC.forEach(d=>{if(!a.r[d])return;let dl=lo+rnd()*(hi-lo);if(dl>0)dl*=clamp((a.pot-a.r[d])/8,0,1.2);a.r[d]=+clamp(a.r[d]+dl,40,a.pot).toFixed(1)});
}
function nextSeason(){
  stopLive();if(S.pend)resolvePend(C()?C().risk:'norm');
  for(const g of['M','W'])while(simNext(g)>=0);
  if(C())C().trainPending=null;
  // Historie
  const h={season:S.season};
  for(const g of['M','W']){const st=standings(g);h[g]={overall:st.slice(0,3).map(o=>BYID[o.id].name+'|'+BYID[o.id].nat+'|'+o.pts),globes:{}};
    DISC.forEach(d=>{const s=standings(g,d)[0];if(s)h[g].globes[d]=BYID[s.id].name+'|'+BYID[s.id].nat});
    if(S[g].wm){h[g].ev=S[g].wm.name;h[g].gold=DISC.map(d=>S[g].wm.races[d][0]?BYID[S[g].wm.races[d][0].id].name:'').join(' · ')}}
  const nm={};['M','W'].forEach(g=>{const n=nations(g);for(const k in n)nm[k]=(nm[k]||0)+n[k]});h.nations=Object.entries(nm).sort((a,b)=>b[1]-a[1])[0];
  // Karriere-Saisonbilanz
  const c=C();
  if(c){const g=c.g;const st=standings(g);const k=st.findIndex(o=>o.id===c.id);const me=BYID[c.id];
    const best=DISC.map(d=>{const kk=standings(g,d).findIndex(o=>o.id===c.id);return kk<0?99:kk+1});
    DISC.forEach((d,j)=>{if(best[j]===1){unlock('globe');clog(`🔮 Kleine Kugel ${DN[d]}!`)}});
    if(k===0){unlock('overall');clog('🏆 GESAMTWELTCUPSIEG!')}
    const wins=cal(g).filter((x,i)=>{const r=S[g].res[i];return r&&r.fin.some(f=>f.id===c.id&&f.rk===1)}).length;
    const pods=cal(g).filter((x,i)=>{const r=S[g].res[i];return r&&r.fin.some(f=>f.id===c.id&&f.rk<=3)}).length;
    if(c.h2h&&c.rival&&c.h2h.w>c.h2h.l){unlock('rival');clog(`⚔️ Saisonduell gegen ${BYID[c.rival]?BYID[c.rival].name:'Rivale'} gewonnen (${c.h2h.w}:${c.h2h.l})`)}
    else if(c.h2h&&c.rival)clog(`⚔️ Saisonduell gegen ${BYID[c.rival]?BYID[c.rival].name:'Rivale'}: ${c.h2h.w}:${c.h2h.l}`);
    if(k>=0&&!st.slice(0,k).some(o=>BYID[o.id].nat===me.nat))unlock('leader');
    const goal=careerGoal(c);if(goal.ok){c.money+=40000;clog('✅ Saisonziel erreicht: +40.000 CHF Bonus')}else clog('❌ Saisonziel verpasst');
    c.seasons.push({s:S.season,age:age(me),rk:k<0?'–':k+1,pts:k<0?0:st[k].pts,wins,pods,best,kader:c.kader,r:{...me.r}});
    const b=Math.min(...best);c.kader=b<=10||(k>=0&&k<15)?'A':b<=30?'B':'C';
    const spons={A:60000,B:30000,C:15000}[c.kader];const upk=salaries();c.money+=spons-upk;
    clog(`Neue Saison: Kader ${c.kader}, Verbandsförderung ${fmtCHF(spons)}${upk?`, Gehälter Betreuerteam −${fmtCHF(upk)}`:''}`);
    sponsorSeason();c.offerFlag=0;
    c.prev={...me.r};}
  S.hist.unshift(h);
  // Entwicklung, Rücktritte, Talente
  const prevInj=c?S[c.g].inj[c.id]:0;
  S.season++;
  const ret=[];
  for(const g of['M','W']){
    S.ath[g]=S.ath[g].filter(a=>{if(a.me)return true;const x=age(a);const best=Math.max(...Object.values(a.r));
      let p=0;if(x>=30&&best<74)p=.5;if(x>=33)p=Math.max(p,.15);if(x>=35)p=Math.max(p,.35);if(x>=37)p=Math.max(p,.7);if(best<66)p=.9;
      if(rnd()<p){ret.push(`${a.name} ${flag(a.nat)}`);return false}return true});
    S.ath[g].forEach(a=>{delete a.rookie;develop(a)});
    const nT=Math.max(4,(g==='M'?84:74)-S.ath[g].length+Math.floor(rnd()*3));for(let k=0;k<nT;k++)S.ath[g].push(newTalent(g));
    S[g]={res:{},form:{},inj:{},news:[],wm:null,seed:{}};
  }
  if(c){c.fat=0;const left=(prevInj||0)-15;if(left>0)S[c.g].inj[c.id]=left;else if(prevInj){c.reha=c.reha;onReturn();c.rust=+(c.rust/2).toFixed(2)}}
  rebuild();if(c){pickRival();makeOffers()}
  const nw=['M','W'].map(g=>ATH[g].filter(a=>a.rookie).map(a=>a.name).join(', '));
  for(const g of['M','W'])S[g].news.unshift(`🆕 Neu im Weltcup: ${nw[g==='M'?0:1]}`);
  if(ret.length)S.M.news.unshift(`👋 Rücktritte: ${ret.join(', ')}`),S.W.news.unshift(`👋 Rücktritte: ${ret.join(', ')}`);
  SEL={M:0,W:0};TAB='home';save();render();toast(`🗓 Saison ${S.season}/${String(S.season+1).slice(2)} beginnt`);
}

function startLive(){
  if(S.pend&&S.pend.ctx.g===G){TAB='race';render();return}
  const i=nextIdx(G);if(i<0||cal(G)[i][3]==='WM')return;
  const x=simNext(G,true);save();SEL[G]=i;TAB='race';if(x==='pause'){render();return}
  playLive(G,i);
}
function playLive(g,i){
  const r=S[g].res[i];let seq;G=g;TAB='races';RV='detail';SEL[g]=i;
  if(r.two){const q=r.fin.concat(r.out.filter(o=>o.st==='DNF2')).sort((a,b)=>b.t1-a.t1);seq=q.map(x=>({id:x.id,t:x.t,dnf:!x.t2}))}
  else seq=r.fin.map(x=>({id:x.id,t:x.t,bib:x.bib})).concat(r.out.map(o=>({id:o.id,dnf:true,bib:o.bib}))).sort((a,b)=>a.bib-b.bib).filter(x=>x.bib<=40||isMe(x.id));
  LIVE={g,i,seq,step:0,board:[],last:null,speed:700,two:r.two};render();tick();
}
function tick(){
  if(!LIVE)return;
  if(LIVE.step>=LIVE.seq.length){const g=LIVE.g;LIVE=null;if(G===g)render();return}
  const x=LIVE.seq[LIVE.step++];LIVE.last=x;
  if(!x.dnf){LIVE.board.push(x);LIVE.board.sort((a,b)=>a.t-b.t)}
  if(G===LIVE.g&&TAB==='races')render();
  LIVE.timer=setTimeout(tick,isMe(x.id)?Math.max(LIVE.speed,1600):LIVE.speed);
}
function liveView(){
  const c=cal(G)[LIVE.i];const x=LIVE.last;const b=LIVE.board;const r=S[G].res[LIVE.i];const wx=WX.find(w=>w.k===r.wx);
  let fin='<span class="mut">Gleich geht’s los…</span>';
  if(x){if(x.dnf)fin=`${nm(x.id)}<div class="t" style="color:var(--bad)">AUSFALL</div>`;
    else{const rk=b.indexOf(x)+1;const d=x.t-b[0].t;
      fin=`${nm(x.id)}<div class="t">${fmtT(x.t)}</div><div class="d ${rk===1?'neg':'pos'}">${rk===1?(b.length>1?'Neue Bestzeit −'+(b[1].t-x.t).toFixed(2):'Erste Zeit'):'+'+d.toFixed(2)} · Platz ${rk}</div>`}}
  const meIn=C()&&LIVE.seq.some(s=>isMe(s.id));
  return `<div class="card"><h2>🔴 LIVE · ${DN[c[3]]} ${flag(c[2])} ${esc(c[1])} ${LIVE.two?'· 2. Durchgang (Gesamtzeit)':''} <span class="wx">· ${wx.n}</span></h2>
   ${C()&&C().g===G&&!meIn?'<p class="mut">Du bist in diesem Lauf nicht dabei.</p>':''}
   <div class="live"><div><div class="finish ${x&&isMe(x.id)?'me':''}">${fin}</div><p class="mut">Läufer:in ${LIVE.step} / ${LIVE.seq.length}</p>
   <button class="btn" data-act="faster">⏩ Schneller</button> <button class="btn" data-act="skip">⏭ Zum Ergebnis</button></div>
   <div><table>${b.slice(0,10).map((y,k)=>`<tr class="p${k+1} ${isMe(y.id)?'me':''}"><td>${k+1}.</td><td>${nm(y.id)}</td><td class="r">${k?fmtD(y.t-b[0].t):fmtT(y.t)}</td></tr>`).join('')}
   ${(()=>{const mi=b.findIndex(y=>isMe(y.id));return mi>=10?`<tr class="me"><td>${mi+1}.</td><td>${nm(b[mi].id)}</td><td class="r">${fmtD(b[mi].t-b[0].t)}</td></tr>`:''})()}</table></div></div></div>`;
}

TAB='home';let STAB='overall',RV='list';
const dkey=md=>{const[m,d]=md.split('-').map(Number);return (m<7?m+12:m)*100+d};
function syncOther(g,i){const og=g==='M'?'W':'M';const dk=dkey(cal(g)[i][0]);let j;while((j=nextIdx(og))>=0&&dkey(cal(og)[j][0])<=dk)simNext(og,false)}
function step(){if(C().trainPending)return 'train';const g=C().g;const i=nextIdx(g);if(i<0)return -1;const x=simNext(g,true);if(x!=='pause'){SEL[g]=i;syncOther(g,i)}return x}
function goNext(){stopLive();const c=C();const g=c.g;let i;
  while((i=nextIdx(g))>=0){const x=cal(g)[i];const me=BYID[c.id];
    const iStart=x[3]==='WM'||(c.starts[x[3]]&&me.r[x[3]]>=60&&available(g,me));

  save();render()}
function oneRace(){stopLive();const r=step();if(r==='pause')TAB='home';save();render()}
function goLive(){stopLive();const g=C().g;if(S.pend){TAB='home';render();return}const i=nextIdx(g);if(i<0||cal(g)[i][3]==='WM'){oneRace();return}

      ${S.pend||c.trainPending?'':`<p class="row-btn"><button class="btn pri" data-act="one">${st.cls==='ok'?'🎿 Ab ins Starthaus':'▶ Trainingstag'}</button>${st.cls!=='ok'?'<button class="btn" data-act="live">📺 Rennen live ansehen</button>':''}</p>`}</div>`}}

function trainCard(c){
  const tp=c.trainPending;const a=BYID[c.id];
  const title=tp.hurt?'🩺 Reha-Tag':tp.day?'🏋️ Trainingstag':'🏋️ Training nach dem Rennen';
  const opts=Object.entries(TOPT).map(([k,t])=>{const T=TINT[TI];const gn=trainGain(k,TI);const cur=DN[k]?a.r[k]:k==='kond'?c.kond:c.mental;const dis=(c.xp||0)<T.c;
    return `<button class="tbtn" data-train="${k}" ${dis?'disabled':''}><b>${t}</b><span class="mut small">${cur.toFixed(DN[k]?1:0)} → <span class="ok">+${gn.toFixed(2)}</span></span></button>`}).join('');
  return `<div class="card train-card"><div class="eyebrow">${esc(tp.what)}${tp.day?' · kein Start':''}</div><h2 class="big">${title}</h2>
   <div class="xpline">${tp.xp.map(([t,v])=>`<span class="pill">+${v} ${esc(t)}</span>`).join(' ')}</div>
   <p class="lead">Du hast <b class="warn">${c.xp||0} XP</b>. ${tp.day&&!tp.hurt?'Ganzer Trainingstag: <b>+40 % Trainingseffekt</b>.':''}${tp.hurt?' Verletzt wirkt Disziplintraining nur zu 30 %.':''}</p>
   <h3>Intensität</h3><div class="opt">${Object.entries(TINT).map(([k,T])=>`<button class="chip ${TI===k?'on':''}" data-int="${k}">${T.n} · ${T.c} XP${T.f?` · Müdigkeit +${T.f}`:''}</button>`).join('')}</div>
   <h3>Was trainierst du?</h3><div class="tgrid">${opts}
   <button class="tbtn reg" data-train="reg"><b>🛌 Regeneration</b><span class="mut small">0 XP · Fitness +${Math.round(18*(1+0.15*lvl('physio')))}</span></button></div>
   ${tp.hurt?'<p style="margin-top:10px"><button class="btn sm" data-act="autoreha">⏩ Reha automatisch bis zum Comeback</button></p>':''}</div>`;
}
function bar(l,v,cls=''){return `<div class="rat"><span class="mut small">${l}</span><div class="barwrap"><i class="${cls}" style="width:${clamp(v,0,100)}%"></i></div><span class="r">${Math.round(v)}</span></div>`}
function myStatus(g,i){const c=C();const a=BYID[c.id];const d=cal(g)[i][3];
  if(S[g].inj[c.id]>0)return{t:'🚑 Du bist verletzt und fällst aus.',cls:'bad'};
  if(a.r[d]<60)return{t:`Du fährst kein ${DN[d]} (Stärke unter 60).`,cls:'mut'};
  if(!c.starts[d])return{t:'⏸ Du setzt bei diesem Rennen aus (regenerierst).',cls:'mut'};
  if(isFinal(g,i)&&!standings(g,d).slice(0,25).some(o=>o.id===c.id))return{t:'❌ Weltcupfinale nur für die Top 25 – du bist nicht dabei.',cls:'bad'};
  const t=teamRank(d);if(!t.fix&&t.rank>t.q)return{t:`❌ Nicht nominiert: Teamrang ${t.rank}, Quote ${t.q}.`,cls:'bad'};
  return{t:`✅ Du startest${t.fix?' (Fixplatz Top 30)':` (Teamrang ${t.rank}/${t.q})`}.`,cls:'ok'}}
function lastResultCard(c){const g=c.g;let li=-1;cal(g).forEach((x,i)=>{if(S[g].res[i])li=i});
  if(li<0)return `<div class="card"><h2>Letztes Rennen</h2><p class="mut">Noch keine Rennen gefahren.</p></div>`;
  const x=cal(g)[li];const r=S[g].res[li];const m=r.fin.find(f=>isMe(f.id));const o=r.out.find(f=>isMe(f.id));
  const my=m?`<div class="bigres">${m.rk}.</div><p>${m.pts?`+${m.pts} Punkte`:'keine Punkte'}${m.rk>1?` · +${(m.t-r.fin[0].t).toFixed(2)} s`:''}</p>`:o?`<div class="bigres bad">${o.st==='DNQ'?'n.q.':'DNF'}</div><p class="mut">${o.st==='DNQ'?'Nicht für den 2. Lauf qualifiziert':'Ausgeschieden'}</p>`:'<div class="bigres mut">–</div><p class="mut">Nicht am Start</p>';
  return `<div class="card"><h2>Letztes Rennen</h2><p class="mut">${tag(x[3])} ${flag(x[2])} ${esc(x[1])} · ${dfmt(x)}</p>${my}
   <table>${r.fin.slice(0,3).map(f=>`<tr ${trc(f.id,'p'+f.rk)}><td>${f.rk}.</td><td>${nm(f.id)}</td></tr>`).join('')}</table>
   <p><button class="btn sm ghost" data-goto="${li}">Ganzes Ergebnis →</button></p></div>`}
function myResults(n){const c=C();const g=c.g;const rows=[];
  cal(g).forEach((x,i)=>{const r=S[g].res[i];if(!r)return;const m=r.fin.find(f=>isMe(f.id));const o=r.out.find(f=>isMe(f.id));if(m||o)rows.push({x,i,m,o})});
  if(!rows.length)return '<p class="mut">Noch keine Starts.</p>';
  return `<table>${rows.slice(-n).reverse().map(({x,i,m,o})=>`<tr class="clk" data-goto="${i}"><td class="mut">${dfmt(x)}</td><td>${tag(x[3])} ${esc(x[1])}</td><td class="r"><b>${m?m.rk+'.':o.st==='DNQ'?'n.q.':'DNF'}</b></td><td class="r mut">${m&&m.pts?'+'+m.pts:''}</td></tr>`).join('')}</table>`}
function seasonSummary(){const c=C();const g=c.g;const st=standings(g);const k=st.findIndex(o=>o.id===c.id);
  return `<p>Gesamtweltcup: <b>${k<0?'ohne Punkte':(k+1)+'. mit '+st[k].pts+' Punkten'}</b>. Sieger:in: ${st[0]?nm(st[0].id):'–'}.</p><p class="mut">Beim Saisonstart altern alle, Stars treten zurück, neue Talente kommen – und dein Kader wird neu eingestuft.</p>`}
function injuryCard(c){const g=c.g;const inj=S[g].inj[c.id];
  if(inj>0&&c.injury){const j=c.injury;const done=clamp((j.total-inj)/j.total,0,1);
    return `<div class="card alert"><h2>🚑 ${j.type} – noch ca. ${inj} Rennen</h2><div class="barwrap"><i style="width:${done*100}%;background:var(--ok)"></i></div>
    <div class="inline" style="margin-top:10px"><span class="mut">Reha:</span> ${Object.entries(REHA).map(([k,[t]])=>`<button class="chip ${c.reha===k?'on':''}" data-reha="${k}">${t}</button>`).join('')}</div>
    <p class="mut small">${REHA[c.reha][1]}. Techniktraining wirkt verletzt nur zu 30 %, Mentaltraining voll.${j.loss?' Achtung: bleibende Folgeschäden möglich.':''}</p></div>`}
  if(inj>0)return `<div class="card alert"><h2>🚑 Du bist verletzt</h2></div>`;
  return '';}
// ---------- Training & Team ----------
let TST='skills';

function pendCard(){
  const p=S.pend;const ctx=p.ctx;const c=cal(ctx.g)[ctx.i];const wx=WX.find(w=>w.k===ctx.wx);const me=C();
  const names=secNames(ctx);const pr=secProb(ctx,p.k);const pj=projection(p);const L=p.L;
  const runLbl=ctx.two?(p.run===1?'1. Lauf':'2. Lauf'):'Dein Lauf';
  const myR=BYID[me.id].r[ctx.disc];const dl=pr.diff-myR;const dtxt=dl>6?'🔴 sehr schwer für dich':dl>1?'🟠 schwer':dl>-4?'🟡 machbar':'🟢 liegt dir';
  const steps=names.map((n,j)=>{const h=p.hist[j];return `<div class="sec ${j<p.k?'done':j===p.k?'now':''}"><span>${j+1}</span>${esc(n)}${h?`<em class="${h.d<0?'ok':'bad'}">${h.d<0?'':'+'}${h.d.toFixed(2)}</em>`:''}</div>`}).join('');
  const last=p.hist[p.hist.length-1];
  const prev=p.run===2&&ctx.mb2?(()=>{const k=ctx.r1.findIndex(x=>x.id===me.id);return `<p class="mut small">Nach Lauf 1: Platz ${k+1} (${k?'+'+(ctx.r1[k].t1-ctx.r1[0].t1).toFixed(2):'Bestzeit'})</p>`})():'';
  const sturzA=(1-pr.pA)*CRASHF[ctx.disc],sturzK=(1-pr.pK)*0.06;
  return `<div class="card race-card"><div class="eyebrow">${runLbl} · ${DN[ctx.disc]} ${flag(c[2])} ${esc(c[1])} · ${wx.n}</div>
   <div class="secbar">${steps}</div>${prev}
   ${last?`<div class="lastsec ${last.d<0?'good':'badbg'}"><b>${esc(last.n)}:</b> ${last.txt} <span>${last.d<0?'':'+'}${last.d.toFixed(2)} s</span></div>`:''}
   <div class="proj"><span>Hochrechnung</span><b>Platz ${pj.rk}</b><span>${pj.rk===1?'Bestzeit!':'+'+Math.max(0,pj.gap).toFixed(2)+' s'}</span></div>
   <h2 class="big">Schlüsselstelle ${p.k+1}/3: ${esc(pr.name)}</h2><p class="mut small">${dtxt} · Fitness ${Math.round(100-me.fat)} · Mental ${Math.round(me.mental)}${lvl('video')?' · 🎥 exakte Quoten':' · Quoten geschätzt'}</p>
   <div class="choices">
    <button class="choice att" data-sec="att"><b>🔥 Angriff</b><span>Erfolg ca. ${pct(pr.pA)} %</span><span>bis −${(0.007*L).toFixed(2)} s · Sturz ~${pct(sturzA)} %</span></button>
    <button class="choice ctrl" data-sec="ctrl"><b>⚖️ Kontrolliert</b><span>Erfolg ca. ${pct(pr.pK)} %</span><span>±0 · Sturz ~${pct(sturzK)} %</span></button>
    <button class="choice safe" data-sec="safe"><b>🛡 Sicher</b><span>kein Risiko</span><span>+${(0.003*L).toFixed(2)} s</span></button>
   </div>
   <p style="margin:10px 0 0"><button class="btn sm ghost" data-act="secauto">⏩ Rest kontrolliert fahren</button></p></div>`;
}

function rRaces(){
  const g=C().g;const c=cal(g);let k=0;
  const rows=c.map((x,i)=>{
    if(x[3]==='WM')return `<div class="row wm ${SEL[g]===i?'sel':''}" data-sel="${i}"><span>🏅</span><span class="n">Feb.</span><span class="v" style="color:var(--gold)">${x[4]} ${esc(x[1])}</span>${tag('WM')}</div>`;
    k++;const r=S[g].res[i];const me=r&&(r.fin.find(f=>isMe(f.id))||r.out.find(f=>isMe(f.id)));
    return `<div class="row ${r?'done':''} ${SEL[g]===i?'sel':''}" data-sel="${i}"><span class="n">${k}</span><span class="n">${dfmt(x)}</span><span class="v">${flag(x[2])} ${esc(x[1])}${realOf(g,i)?'<span class="real">ECHT</span>':''}</span>${tag(x[3])}${r?`<span class="w">🥇 ${esc(BYID[r.fin[0].id]?.name||'')}${me?` · <b style="color:var(--gold)">Du: ${me.rk?me.rk+'.':me.st==='DNQ'?'n.q.':'DNF'}</b>`:''}</span>`:''}</div>`}).join('');
  const banner=C().trainPending&&!LIVE?`<div class="card train-card" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px"><b>🏋️ Training steht an</b><button class="btn gold sm" data-tab="home">Training wählen →</button></div>`:'';
  return banner+`<div class="grid ${RV==='detail'?'show-detail':'show-list'}"><div class="card cal">${rows}</div><div class="detail"><button class="btn sm ghost mobonly" data-rv="list" style="margin-bottom:10px">← Kalender</button>${LIVE&&LIVE.g===g?liveView():raceDetail(SEL[g])}</div></div>`;
}

function rStand(){

  else if(DN[STAB]){const st=standings(g,STAB);const rem=remaining(g,STAB);const dec=decided(g,STAB);body=`<div class="card"><h2>${dec&&st[0]?'🔮 Kleine Kugel: '+nm(st[0].id):DN[STAB]+'-Weltcup'} <span class="mut small">· noch ${rem} Rennen</span></h2>${stTable(st,STAB)}</div>`}
  else if(STAB==='nations')body=rNations();

function bind(){
  const on=(sel,f)=>document.querySelectorAll(sel).forEach(e=>e.onclick=ev=>{ev.stopPropagation();f(e)});
  on('[data-tab]',e=>{TAB=e.dataset.tab;if(TAB==='races'&&!LIVE)RV='list';render();window.scrollTo(0,0)});
  on('[data-stab]',e=>{STAB=e.dataset.stab;render()});
  on('[data-sel]',e=>{SEL[G]=+e.dataset.sel;RV='detail';render();window.scrollTo(0,0)});
  on('[data-rv]',e=>{RV=e.dataset.rv;render()});
  on('[data-train]',e=>doTrain(e.dataset.train));
  on('[data-int]',e=>{TI=e.dataset.int;render()});
  on('[data-goto]',e=>{SEL[G]=+e.dataset.goto;TAB='races';RV='detail';render();window.scrollTo(0,0)});
  on('[data-ath]',e=>athModal(e.dataset.ath));
  on('[data-cf]',e=>{const[k,v]=e.dataset.cf.split(':');CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF[k]=v;render()});
  on('[data-start]',e=>{const d=e.dataset.start;C().starts[d]=!C().starts[d];save();render()});
  on('[data-risk]',e=>{C().risk=e.dataset.risk;save();render()});
  on('[data-focus]',e=>{C().focus=e.dataset.focus;save();render()});
  on('[data-reha]',e=>{C().reha=e.dataset.reha;save();render()});
  on('[data-inter]',e=>{C().interactive=e.dataset.inter==='1';save();render()});
  on('[data-sec]',e=>{resolveSection(e.dataset.sec);save();render();window.scrollTo(0,0)});
  on('[data-tst]',e=>{TST=e.dataset.tst;render()});
  on('[data-hire]',e=>hire(e.dataset.hire));
  on('[data-fire]',e=>fire(e.dataset.fire));
  on('[data-sign]',e=>signSponsor(+e.dataset.sign));
  on('[data-world]',e=>{CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF.world=e.dataset.world;render()});
  on('[data-act]',e=>{const a=e.dataset.act;
    if(a==='next')goNext();if(a==='one')oneRace();if(a==='live')goLive();if(a==='sim')oneRace();
    if(a==='faster'&&LIVE)LIVE.speed=Math.max(80,LIVE.speed/2);
    if(a==='skip'&&LIVE){clearTimeout(LIVE.timer);LIVE=null;render()}
    if(a==='season')nextSeason();if(a==='secauto'){let n=0;while(S.pend&&n++<10)resolveSection('ctrl');save();render()}if(a==='autoreha')autoRehab();
    if(a==='newcareer'){CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;newCareer();TAB='home';render()}
    if(a==='retire'){if(e.dataset.arm)retireCareer();else{e.dataset.arm=1;e.textContent='⚠ Wirklich beenden? Nochmal klicken'}}
    if(a==='wipe'){if(e.dataset.arm){S=fresh();rebuild();initReal();render()}else{e.dataset.arm=1;e.textContent='⚠ Alles löschen? Nochmal klicken'}}});
  const aq=$('#aq');if(aq){aq.oninput=()=>{AFILT=aq.value;const p=aq.selectionStart;render();const n=$('#aq');n.focus();n.setSelectionRange(p,p)};$('#an').onchange=e=>{NTAB=e.target.value;render()}}
  const cn=$('#cfName');if(cn)cn.oninput=()=>CF.name=cn.value;
}
