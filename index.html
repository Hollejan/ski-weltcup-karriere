<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Ski-Weltcup-Karriere</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1622;--panel:#13202f;--panel2:#182a3d;--line:#24394f;--txt:#e8eef5;--mut:#8ea3b8;--acc:#e63946;--ice:#7cc6fe;--gold:#f4c430;--silver:#c9d1d9;--bronze:#d08a4c;--ok:#4fd18b;--bad:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -100px,#1d3550 0,transparent 70%),var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 20px 10px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:20px}h1 small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mut);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 13px;border-radius:9px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--ice)}.btn.pri{background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1f00;font-weight:700}
.btn.ghost{background:none}.btn:disabled{opacity:.4;cursor:default}.btn.sm{padding:5px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--txt);border-color:var(--ice)}
main{padding:16px 20px 40px;max-width:1300px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid,.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:15px}.card h3{margin:14px 0 6px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cal{max-height:72vh;overflow:auto;padding:0}
.cal .row{display:grid;grid-template-columns:28px 52px 1fr 40px;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.cal .row:hover{background:var(--panel2)}.cal .row.sel{background:#1f3a55}
.cal .row .v{color:var(--mut)}.cal .row.done .v{color:var(--txt)}.cal .row .n{color:var(--mut);font-size:12px}
.cal .row .w{grid-column:3/5;font-size:12px;color:var(--mut)}.cal .wm{background:linear-gradient(90deg,#3b2b05,transparent)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;text-align:center}
.DH{background:#5a1e24;color:#ffb3ba}.SG{background:#5a3b14;color:#ffd59a}.GS{background:#15405a;color:#a9dcff}.SL{background:#1e4a32;color:#a7f0c6}.WM{background:#5a4a05;color:var(--gold)}
.real{font-size:10px;background:var(--ok);color:#06210f;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px}
.meb{font-size:10px;background:var(--gold);color:#2a1f00;padding:1px 5px;border-radius:4px;font-weight:700;margin-left:4px}
table{width:100%;border-collapse:collapse}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--panel)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.p1 td:first-child{color:var(--gold);font-weight:700}tr.p2 td:first-child{color:var(--silver);font-weight:700}tr.p3 td:first-child{color:var(--bronze);font-weight:700}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--panel2)}
tr.me td{background:rgba(244,196,48,.13)}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.scroll{overflow:auto;max-height:68vh}
.hero{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.stat{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{color:var(--mut);font-size:12px}.stat .v{font-size:18px;font-weight:700;margin-top:2px}.stat .s{color:var(--mut);font-size:12px}
.podium{display:flex;gap:10px;align-items:flex-end;margin:6px 0 14px}
.podium div{flex:1;text-align:center;border-radius:10px 10px 0 0;padding:10px 6px;background:var(--panel2)}
.podium .g{height:110px;border-top:3px solid var(--gold)}.podium .s{height:90px;border-top:3px solid var(--silver)}.podium .b{height:75px;border-top:3px solid var(--bronze)}
.podium b{display:block;font-size:14px}.podium span{font-size:12px;color:var(--mut)}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.subnav.sub2{margin-top:-4px}.subnav.sub2 .chip{font-size:12px;padding:4px 9px}.subnav.sub2 .chip:not(.on){background:transparent}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;color:var(--mut);cursor:pointer;font:inherit;font-size:13px}
.chip.on{color:#fff;border-color:var(--ice);background:#1f3a55}
.news{font-size:13px}.news div{padding:5px 0;border-bottom:1px dashed var(--line)}
.inj{color:var(--bad);font-size:11px;margin-left:6px}
.wx{font-size:12px;color:var(--mut);font-weight:400}
.live{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.live{grid-template-columns:1fr}}
.finish{font-size:22px;font-weight:700;padding:16px;border-radius:12px;background:var(--panel2);text-align:center;min-height:110px}
.finish.me{outline:2px solid var(--gold)}
.finish .t{font-size:30px;font-variant-numeric:tabular-nums}.finish .d{font-size:16px}.neg{color:var(--ok)}.pos{color:var(--bad)}
.barwrap{background:#0a1520;border-radius:6px;height:8px;overflow:hidden}
.barwrap i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),#fff)}
.barwrap i.f{background:linear-gradient(90deg,#4fd18b,#f4c430,#e63946)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal .card{max-width:620px;width:100%;max-height:88vh;overflow:auto}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit}
label.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
.rat{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:6px 0}
.foot{color:var(--mut);font-size:12px;margin-top:18px;max-width:900px}
.globe{font-size:12px;color:var(--gold)}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;opacity:.45}
.ach div.on{opacity:1;border-color:var(--gold)}.ach b{display:block;font-size:13px}
.shop{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px}
.toast{position:fixed;right:16px;bottom:16px;background:var(--gold);color:#2a1f00;font-weight:700;padding:12px 16px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);transform:translateY(120px);transition:.3s;z-index:20;max-width:340px}
.toast.on{transform:none}

main{max-width:1240px;margin:0 auto;padding:16px 20px 60px}
header.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(12,22,34,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.who{display:flex;gap:12px;align-items:center}.avatar{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel2);border-radius:12px}
.who .nm{font-weight:700;font-size:16px}.who .sub{color:var(--mut);font-size:12px}
.kpis{display:flex;gap:6px;flex-wrap:wrap}.kpis div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px;min-width:78px}
.kpis span{display:block;font-size:11px;color:var(--mut)}.kpis b{font-size:15px}
.acts{display:flex;gap:6px}
html{background:var(--bg)}body{min-height:100vh;background-attachment:fixed}
nav{background:transparent;justify-content:flex-start;max-width:1240px;margin:0 auto;padding:10px 20px 0;border:0;gap:6px}
nav button{border:1px solid transparent;border-radius:9px;padding:8px 14px}
nav button.on{background:var(--panel2);border-color:var(--line);color:var(--txt)}
.g2,.g3,.g21{margin-top:16px}.g21{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.g21{grid-template-columns:1fr}.kpis div{min-width:64px}}
.hero-card{background:linear-gradient(135deg,#183553,#13202f 60%)}
.review h3{margin-top:14px}.revtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.revtiles div{background:rgba(255,255,255,.05);padding:8px;text-align:center}.revtiles span{display:block;font-size:11px;color:var(--mut)}.revtiles b{font-size:22px}
.revbox{padding:12px;border-left:4px solid var(--line);background:rgba(255,255,255,.04)}.revbox span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}.revbox.good{border-left-color:var(--ok)}.revbox.bad{border-left-color:var(--bad)}
.heads div{padding:8px 0;border-bottom:1px solid var(--line);font-style:italic}.heads span{display:block;font-style:normal;font-size:11px;color:var(--ice);text-transform:uppercase}
.revlist{margin-top:12px}.revlist summary{cursor:pointer;color:var(--ice)}
.hud-svg{position:relative}.hud-svg.egov{min-height:190px}.hud-svg canvas#ego{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.egotog{position:absolute;right:8px;bottom:8px;z-index:2;background:rgba(7,26,49,.8);color:#fff;border:1px solid rgba(255,255,255,.25);font:600 12px var(--cond);padding:4px 8px;border-radius:3px;cursor:pointer}
.egoend{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;align-items:center}.egoend canvas{flex:1 1 auto;width:100%;display:block}.egoend span{padding:10px;color:#9fb3cc}
.review>.card,.review>.g2{margin-bottom:12px}.revbox td.r{white-space:nowrap;vertical-align:top}.rv-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rv-rank{background:rgba(7,26,49,.6);padding:8px 14px;text-align:center;min-width:92px;border-left:4px solid var(--gold)}.rv-rank span{display:block;font-size:11px;color:var(--mut)}.rv-rank b{display:block;font:800 34px var(--cond);line-height:1}.rv-rank em{font-style:normal;font-size:12px;color:var(--mut)}
.rv-trophy{margin:10px 0;padding:10px 12px;background:linear-gradient(90deg,rgba(244,196,48,.3),rgba(244,196,48,.05));border-left:4px solid var(--gold);font:800 18px var(--cond);color:var(--gold)}
.globes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.globe-t{background:rgba(255,255,255,.04);border-left:4px solid var(--line);padding:10px;display:grid;gap:2px;align-content:start}
.globe-t.big{grid-column:1/-1;border-left-color:var(--gold);background:linear-gradient(90deg,rgba(244,196,48,.14),rgba(255,255,255,.03))}.globe-t.big .gl-w b{font-size:22px}
.globe-t.mine{border-left-color:var(--gold);background:rgba(244,196,48,.18)}.globe-t.mine .gl-w b{color:var(--gold)}
.gl-ic{font-size:22px;line-height:1}.globe-t.big .gl-ic{font-size:30px}.gl-l{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ice)}.gl-w b{font:800 17px var(--cond)}.gl-p{font-size:11.5px;color:var(--mut)}.gl-me{font-size:12px;margin-top:4px}
.gl-foot{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13px;align-items:center}
@media(max-width:600px){.globes{grid-template-columns:1fr 1fr}}
.offer.renew{border:2px solid var(--gold);background:rgba(244,196,48,.1)}
.drawgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.lot{aspect-ratio:3/4;border:2px solid var(--line);background:linear-gradient(160deg,#1f4b7a,#0e223a);color:var(--txt);font:inherit;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.lot b{font-size:26px;font-family:var(--cond)}.lot span{font-size:10px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
button.lot:active{transform:scale(.94)}.lot.open{cursor:default;background:var(--panel2);animation:flip .4s}.lot.me{border-color:var(--gold);background:rgba(244,196,48,.16)}.lot.me b{color:var(--gold)}.lot.me span{color:var(--gold);font-weight:700}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.gold{color:var(--gold)}.pill.gold{border-color:var(--gold);color:var(--gold)}
.cere-card{position:relative;overflow:hidden}.cere-card.win{background:linear-gradient(160deg,#5a4510,#16263a 70%)}.cere-card.pod-on:not(.win){background:linear-gradient(160deg,#2a3f5c,#13202f 70%)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:end;margin:16px 0 8px}
.pod{display:flex;flex-direction:column;align-items:stretch;text-align:center}
.pod .pn{display:flex;flex-direction:column;align-items:center;font-size:12px;margin-bottom:6px}.pod .pn b{font-size:14px;font-family:var(--cond);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .pn span{color:var(--mut);font-size:11px}
.pod .pb{display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font:800 26px var(--cond);border-radius:4px 4px 0 0;animation:rise .7s ease-out}
.pod.p1 .pb{background:linear-gradient(#f4c430,#a8841a);color:#2b2100}.pod.p2 .pb{background:linear-gradient(#d7dde6,#8d98a8);color:#1c2430}.pod.p3 .pb{background:linear-gradient(#d08a4e,#8a5427);color:#2a1606}
.pod.me .pn b{color:var(--gold)}
@keyframes rise{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.coach{margin-top:12px;padding:10px 12px;border-left:4px solid var(--acc);background:rgba(255,255,255,.04)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:7px;height:12px;opacity:.9;animation:fall 2.8s linear infinite}
.confetti i:nth-child(3n){background:var(--gold)}.confetti i:nth-child(3n+1){background:#e63946}.confetti i:nth-child(3n+2){background:#fff}
.confetti i:nth-child(1){left:0%;animation-delay:0.00s;animation-duration:2.2s}.confetti i:nth-child(2){left:37%;animation-delay:0.17s;animation-duration:2.5s}.confetti i:nth-child(3){left:74%;animation-delay:0.34s;animation-duration:2.8s}.confetti i:nth-child(4){left:11%;animation-delay:0.51s;animation-duration:3.1s}.confetti i:nth-child(5){left:48%;animation-delay:0.68s;animation-duration:3.4s}.confetti i:nth-child(6){left:85%;animation-delay:0.85s;animation-duration:2.2s}.confetti i:nth-child(7){left:22%;animation-delay:1.02s;animation-duration:2.5s}.confetti i:nth-child(8){left:59%;animation-delay:1.19s;animation-duration:2.8s}.confetti i:nth-child(9){left:96%;animation-delay:1.36s;animation-duration:3.1s}.confetti i:nth-child(10){left:33%;animation-delay:1.53s;animation-duration:3.4s}.confetti i:nth-child(11){left:70%;animation-delay:1.70s;animation-duration:2.2s}.confetti i:nth-child(12){left:7%;animation-delay:1.87s;animation-duration:2.5s}.confetti i:nth-child(13){left:44%;animation-delay:2.04s;animation-duration:2.8s}.confetti i:nth-child(14){left:81%;animation-delay:2.21s;animation-duration:3.1s}.confetti i:nth-child(15){left:18%;animation-delay:2.38s;animation-duration:3.4s}.confetti i:nth-child(16){left:55%;animation-delay:2.55s;animation-duration:2.2s}.confetti i:nth-child(17){left:92%;animation-delay:2.72s;animation-duration:2.5s}.confetti i:nth-child(18){left:29%;animation-delay:0.09s;animation-duration:2.8s}
@keyframes fall{to{transform:translateY(520px) rotate(540deg)}}
.eyebrow{font-size:12px;color:var(--ice);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
h2.big{font-size:22px;margin:2px 0 10px}
.status{padding:9px 12px;border-radius:9px;background:var(--panel2);margin:6px 0 10px;font-weight:600}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.bigres{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0}
.alert{border-color:var(--bad);margin-bottom:16px}
.card.alert h2{color:var(--bad)}
.kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.kpirow .card span{display:block;color:var(--mut);font-size:12px}.kpirow .card b{font-size:20px}
@media(max-width:900px){.kpirow{grid-template-columns:repeat(2,1fr)}}
.create{max-width:1000px;margin:40px auto;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px}@media(max-width:900px){.create{grid-template-columns:1fr;margin-top:16px}}
.chip.big{border-radius:12px;padding:10px 14px;text-align:left}
.btn.lg{padding:12px 22px;font-size:16px}
.warn{color:var(--gold)}.small{font-size:12px}.lead{font-size:15px;margin:4px 0}
.barwrap i.f2{background:linear-gradient(90deg,#e63946,#f4c430,#4fd18b)}
.card+.card{margin-top:0}


.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cur{background:rgba(79,209,139,.08);border:1px solid rgba(79,209,139,.35);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:4px}
.cur .btn{justify-self:start}
.cand{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.stars{color:var(--gold);letter-spacing:1px}
.offer{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}.offer .btn{justify-self:start}
.race-card{border-color:var(--ice);background:linear-gradient(160deg,#1b3a5c,#13202f 70%);margin-bottom:16px}
.secbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.sec{background:var(--panel2);border-radius:9px;padding:7px 8px;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sec span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#0a1520;font-size:11px}
.sec.now{outline:2px solid var(--gold);color:var(--txt)}.sec.done{color:var(--txt)}.sec em{font-style:normal;margin-left:auto;font-weight:700}
.lastsec{padding:9px 12px;border-radius:9px;margin:8px 0}.lastsec.good{background:rgba(79,209,139,.15)}.lastsec.badbg{background:rgba(255,138,138,.14)}.lastsec span{float:right;font-weight:700}

/* =============== TV-GRAFIK =============== */
:root{--bg:#0A1F3A;--panel:#0F2847;--panel2:#163560;--line:#21456F;--txt:#F3F6FA;--mut:#9FB3CC;--acc:#E10A2B;--ice:#5CC8FF;--gold:#FFC93C;--ok:#22C55E;--bad:#FF5A5F;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
html{background:var(--bg)}
body{font-family:var(--body);font-size:15px;background:
  linear-gradient(180deg,rgba(10,31,58,.0),rgba(10,31,58,.95) 420px),
  repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px),
  radial-gradient(900px 420px at 80% -120px,#1f4f86 0,transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,h3,.big,.bigres,.kpis b,.proj b,.splits b,.gapgrid b,.btn,.chip,.bnav button,nav button,.stat .v,.kpirow b,.finish,.lead b{font-family:var(--cond)}
.card{background:linear-gradient(180deg,rgba(23,53,96,.55),rgba(15,40,71,.92));border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
.card h2{font-size:19px;font-weight:700;letter-spacing:.2px;padding-left:10px;border-left:4px solid var(--ice);line-height:1.15}
.card h3{font-family:var(--cond);font-size:14px;letter-spacing:.4px;text-transform:none;color:var(--ice)}
h2.big{font-size:26px;font-weight:800;line-height:1.05;border-left:0;padding-left:0}
.eyebrow{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:none;color:var(--ice)}
.btn{border-radius:3px;font-weight:700;font-size:16px;letter-spacing:.3px;padding:9px 16px}
.btn.pri,.btn.racebtn{background:var(--acc);border-color:var(--acc);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-left:20px;padding-right:20px}
.btn.gold{clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-left:20px;padding-right:20px;color:#1a1300}
.btn.sm{font-size:14px;padding:6px 12px}
.chip{border-radius:3px;font-weight:600;font-size:14px}
.chip.on{background:var(--ice);border-color:var(--ice);color:#06213d}
.chip.big.on{background:#1d4a7e;color:#fff;border-color:var(--ice)}
.pill{border-radius:3px;font-family:var(--cond);font-weight:600;font-size:13px}
/* Namen im TV-Stil */
.sn{font-family:var(--cond);font-weight:700;letter-spacing:.4px}
.fn{opacity:.85}
/* Kopfzeile als Scorebug */
header.top{background:linear-gradient(90deg,#071a31,#0c2647);border-bottom:3px solid var(--acc)!important}
.avatar{border-radius:3px;background:var(--acc);font-size:26px}
.who .nm{font-family:var(--cond);font-size:22px;font-weight:800;letter-spacing:.3px}
.kpis{gap:0}
.kpis div{background:#0f2b4f;border:0;border-left:1px solid #21456F;border-radius:0;padding:5px 12px}
.kpis div:first-child{border-left:0;border-radius:3px 0 0 3px}.kpis div:last-child{border-radius:0 3px 3px 0}
.kpis span{font-family:var(--cond);letter-spacing:.3px;font-size:12px}
.kpis b{font-size:20px;font-weight:700}
nav#tabs button{font-size:16px;font-weight:600;border-radius:0;border:0;border-bottom:3px solid transparent;padding:8px 12px}
nav#tabs button.on{background:transparent;border-bottom-color:var(--acc)}
.bnav{background:rgba(7,26,49,.98)!important;border-top:2px solid var(--acc)!important}
.bnav button{font-size:12px!important;font-weight:600}
.bnav button{border-radius:0!important}.bnav button.on{background:transparent!important;color:#fff!important;box-shadow:inset 0 3px 0 var(--acc)}
/* Phasenleiste */
.phase{border-radius:3px}
.st{font-family:var(--cond);font-size:15px}
.pinfo{font-family:var(--cond);font-size:17px}.pinfo b{letter-spacing:.6px}
/* Zeitlisten */
table{font-variant-numeric:tabular-nums}
th{background:transparent;font-family:var(--cond);font-size:13px;letter-spacing:.3px;color:var(--mut)}
td{border-bottom:1px solid rgba(33,69,111,.6)}
.tl tr:nth-child(even) td{background:rgba(255,255,255,.025)}
.tl td:first-child{width:38px}
.tl tr td:first-child{font-family:var(--cond);font-weight:700;font-size:16px;text-align:center;color:#fff;background:linear-gradient(90deg,#163560,#163560) no-repeat center/30px 24px}
.tl tr.p1 td:first-child{color:#1a1300;background-image:linear-gradient(90deg,var(--gold),var(--gold))}
.tl tr.p2 td:first-child{color:#0b1c30;background-image:linear-gradient(90deg,#D9E2EC,#D9E2EC)}

function wcsl(g,disc){const m={};const prev=(S.prevPts&&S.prevPts[g])||{};
  ATH[g].forEach(a=>{const p=(prev[a.id]||{})[disc]||0;if(p>0)m[a.id]=p});
  standings(g,disc).forEach(o=>{if(o.pts>(m[o.id]||0))m[o.id]=o.pts});return m}

// FIS-Regeln: Technik 1–7 & 8–15 gelost, 16–30 nach WCSL; Speed Top 10 auf 6–15, 11–20 auf 1–5 & 16–20, ≥500 Pkt direkt danach, Rest 21–30 gelost
function bibOrder(list,two,wc){
  const hasP=a=>(wc[a.id]||0)>0;const top=list.filter(hasP).slice(0,30);const rest=list.filter(a=>!top.includes(a));
  let order=[];
  if(two){order=shuffle(top.slice(0,7)).concat(shuffle(top.slice(7,15)),top.slice(15))}
  else{const slots=new Array(30).fill(null);const g1=shuffle(top.slice(0,10)),g2=shuffle(top.slice(10,20));
    const lead=Math.min(5,g2.length);g1.forEach((a,k)=>slots[5+k]=a);[0,1,2,3,4].slice(5-lead).concat([15,16,17,18,19]).forEach((s,k)=>{if(g2[k])slots[s]=g2[k]});
    const g3=top.slice(20);const big=g3.filter(a=>wc[a.id]>=500),small=shuffle(g3.filter(a=>wc[a.id]<500));let p=20;big.concat(small).forEach(a=>slots[p++]=a);
    order=slots.filter(Boolean)}
  return order.concat(rest);
}

}

  if(isMe(a.id)){const c=C();const rk=RISKOV||c.risk;
    mean+=-wearPen()-Math.max(0,(c.load||0)-60)*0.04+lvl('service')*0.3+skiBonus(disc)-(c.skiAdapt||0)*0.08-Math.max(0,c.fat-35)*0.07-(c.rust||0);
    if(tr)mean+=Math.min(0.7,0.2*((c.trk||{})[tr.key]||0)*(1+0.5*lvl('video')));
    if(tr&&tr.night)mean+=(c.mental-50)/25+(hasPerk('night')?0.5:0);
    if(hasPerk('glide')&&(disc==='DH'||disc==='SG')&&tr&&tr.dnf<1.1)mean+=0.5;if(hasPerk({SL:'slf',GS:'gsf',DH:'dhf',SG:'sgf'}[disc]))mean+=0.4;if(hasPerk('snow')&&['snow','soft'].includes(wx.k))mean+=0.5;if(hasPerk('veteran')&&age(a)>=30)mean+=0.6;if(hasPerk('home')&&a.nat===vnat)mean+=0.5;
    sig*=1-(c.mental-50)/250;

const TINT={light:{n:'Locker',c:5,g:.12,f:3,s:.7},norm:{n:'Normal',c:10,g:.25,f:7,s:1.5},hard:{n:'Intensiv',c:20,g:.45,f:14,s:2.6}};
const TOPT={GS:'🔵 Riesentorlauf',SL:'🟢 Slalom',DH:'🔴 Abfahrt',SG:'🟠 Super-G',kond:'💪 Kondition',mental:'🧠 Mental'};
let TI='norm';
function dnum(md){const[m,d]=md.split('-').map(Number);return Date.UTC(m>=7?2001:2002,m-1,d)/864e5}
function gapDays(g,i){const c=cal(g);const n=c[i+1];return n?Math.max(1,dnum(n[0])-dnum(c[i][0])):7}
function careerDay(started,xp,what,gap=3){
  const c=C();if(!c.lastDay||c.lastDay.what!==undefined)c.lastDay=c.lastDay||{};
  if(!started)spend('Training',c.kader==='J'?100:300);spend('Gehälter',Math.round(salaries()/40));c.lastDay.cost=c.dayCost;c.lastDay.what=what;checkDebt();const g=c.g;const hurt=S[g].inj[c.id]>0;
  if(!started){xp=xp.filter(x=>!x[0].startsWith('Training'));xp.push([hurt?'Reha-Tag':'Trainingstag',hurt?4:10])}
  if(own('sim'))xp.push(['🥽 Simulator',3]);
  {const xm=DF().xp*(hasPerk('xpboost')?1.15:1);if(xm!==1)xp=xp.map(([t,v])=>[t,Math.round(v*xm)])}
  const sum=xp.reduce((n,x)=>n+x[1],0);c.xp=(c.xp||0)+sum;
  c.pop=Math.max(0,(c.pop||10)-0.25);
  if(!started)loadAdd(-3);if(standings(c.g)[0]&&standings(c.g)[0].id===c.id&&standings(c.g)[1]){c.fat=clamp(c.fat+3,0,100)}const hd=c.sp&&c.sp.head;c.fat=hurt?0:clamp(c.fat-(clamp(2.2*gap,3,16)+(hd&&hd.perk==='fit'?4:0))*(1+0.15*lvl('physio'))*(hasPerk('recover')?1.2:1)*ownRec()*(1-Math.max(0,(c.load||0)-50)/100)*(1-(c.body||0)/250),0,100);
  c.trainPending={day:!started,hurt,what,xp,sum};
}
function trainGain(opt,int){
  const c=C();const a=BYID[c.id];const T=TINT[int];const dayF=Math.max(0.4,1-0.2*((c.trainPending&&c.trainPending.n)||0))*(hasPerk('learn')?1.1:1);const tm=dayF*(1+0.2*lvl(opt==='GS'||opt==='SL'?'tech':'speed'))*ageF(a)*(c.trainPending&&c.trainPending.day?1.4:1)*(S[c.g].inj[c.id]>0&&DN[opt]?0.3:1);
  if(DN[opt]){const room=Math.max(0,a.pot-a.r[opt]);return 0.8*T.g*tm*clamp(room/(a.pot-60),0.06,1)}
  const v=opt==='kond'?c.kond:c.mental;return Math.max(0.4,1-0.2*((c.trainPending&&c.trainPending.n)||0))*T.s*(1+0.3*lvl(opt==='kond'?'kond':'mental'))*(opt==='kond'&&own('gym')?1.2:1)*clamp((100-v)/50,0.15,1);
}
function doTrain(opt){
  const c=C();const a=BYID[c.id];const tp=c.trainPending;if(!tp)return;
  tp.done=tp.done||[];
  if(tp.reg)return;
  if(opt==='reg'){if(tp.n)return;tp.reg=1;loadAdd(-8);if(!tp.hurt)c.body=Math.max(0,(c.body||0)-(0.3+0.2*lvl('physio')));c.fat=clamp(c.fat-18*(1+0.15*lvl('physio')),0,100);c.tlog=[`${tp.what}: 🛌 Regeneration`].concat(c.tlog||[]).slice(0,30);tp.done.push('🛌 Regeneration');toast('🛌 Ruhetag – Fitness steigt');c.trainPending=null;maybeEvent();save();render();window.scrollTo(0,0);return}
  else{const T=TINT[TI];const cost=trainCost(opt,TI);if((c.xp||0)<cost)return;c.xp-=cost;const gn=trainGain(opt,TI);
    if(DN[opt])a.r[opt]=+Math.min(a.pot,a.r[opt]+gn).toFixed(2);else if(opt==='kond')c.kond=clamp(c.kond+gn,0,100);else c.mental=clamp(c.mental+gn,0,100);
    if(S[c.g].inj[c.id]>0)c.fat=0;else c.fat=clamp(c.fat+T.f*(1-0.08*lvl('kond')),0,100);
    const msg=`${TOPT[opt]} ${T.n}: +${gn.toFixed(2)} (−${cost} XP)`;c.tlog=[`${tp.what}: ${msg}`].concat(c.tlog||[]).slice(0,30);tp.done.push(msg);tp.n=(tp.n||0)+1;loadAdd(TI==='hard'?3:TI==='norm'?1.5:0.7);toast('🏋️ '+msg)}
  save();render();
}
function endDay(){const c=C();if(!c.trainPending)return;c.trainPending=null;maybeEvent();save();render();window.scrollTo(0,0)
}
function autoRehab(){const c=C();let n=0;while(S[c.g].inj[c.id]>0&&nextIdx(c.g)>=0&&n<60){if(c.trainPending)doTrainSilent();const r=step();if(r==='pause')break;n++}if(c.trainPending&&S[c.g].inj[c.id]>0)doTrainSilent();save();render()}

const WAX={cold:'❄️ Kalt/Trocken',uni:'🌤 Universal',warm:'💧 Warm/Nass'},WAXO=['cold','uni','warm'];
const SETUP={agg:['⚡ Aggressiv','schnell auf Eis & hartem Schnee, heikel bei weichen Verhältnissen'],bal:['⚖️ Ausgewogen','passt immer ein bisschen'],soft:['🌊 Ruhig/Weich','stark bei Neuschnee, weicher Piste & schlechter Sicht']};
function waxTruth(ctx){if(ctx.waxT)return ctx.waxT;const m=+cal(ctx.g)[ctx.i][0].slice(0,2);let t=ctx.wx==='soft'?'warm':ctx.wx==='snow'||ctx.wx==='fog'?'uni':[12,1,2].includes(m)?'cold':'uni';
  if(rnd()<.2){const k=WAXO.indexOf(t);t=WAXO[clamp(k+(rnd()<.5?-1:1),0,2)]}ctx.waxT=t;
  const acc=Math.min(0.99,[0.5,0.7,0.85,0.95,0.98][lvl('service')]+0.05*lvl('skitest'));ctx.waxTip=hasPerk('wax')||rnd()<acc?t:pick(WAXO.filter(x=>x!==t));return t}
function hardSnow(ctx){const{tr}=ctxO(ctx);return !['soft','snow','fog'].includes(ctx.wx)||tr.dnf>=1.4}
function applySetup(ctx,setup,wax){
  const t=waxTruth(ctx);const dist=Math.abs(WAXO.indexOf(t)-WAXO.indexOf(wax));const hard=hardSnow(ctx);
  let f=[-0.003,0.0015,0.004][dist],pa=0;
  if(setup==='agg'){f+=hard?-0.002:0.002;pa=hard?-0.02:-0.06}else if(setup==='soft'){f+=hard?0.0015:-0.0015;pa=hard?0.03:0.04}
  ctx.setup={s:setup,w:wax,f,pa,txt:`${dist===0?'Wachs passt perfekt':dist===1?'Wachs nicht ganz optimal':'Falsches Wachs!'} · ${setup==='bal'?'Setup ausgewogen':(setup==='agg')===hard?'Setup passt zur Piste':'Setup passt nicht zur Piste'}`};
}

  else{ok=rnd()<pr.pK;txt=ok?'Sauber – im Rennen +6 % kontrolliert':'Wackler, aber ins Ziel'}
  ctx.lines=ctx.lines||{};if(ok)ctx.lines[p.k]=ch;p.hist.push({n:pr.name,ch,ok,txt});p.k++;
  if(p.k>=3){const c=C();c.fat=clamp(c.fat+4,0,100);c.trk=c.trk||{};const{tr}=ctxO(ctx);c.trk[tr.key]=(c.trk[tr.key]||0)+0.5;
    const others=ctx.ids.filter(id=>!isMe(id)).map(id=>({id,t:runTime(ctx.base,perf(ctx.g,BYID[id],ctx.disc,ctx.vnat,WX[0],0,tr)+gauss()*2)}));
    const myT=ctx.mb1.t-ctx.mb1.t*0.002*p.hist.filter(h=>h.ok).length+gauss()*0.3;others.push({id:C().id,t:myT});others.sort((a,b)=>a.t-b.t);p.board=others.map(x=>[x.id,+x.t.toFixed(2)]);p.done=1}
}

function pressure(ctx,run){
  const c=C();const g=ctx.g;const r=[];let p=0;const x=cal(g)[ctx.i];
  if(x[2]===BYID[c.id].nat){p+=1;r.push('Heimrennen')}
  if(isFinal(g,ctx.i)){p+=1;r.push('Weltcupfinale')}
  if(ctx.wm){p+=1.5;r.push(eventOf(S.season)[0]==='Olympia'?'Olympische Spiele':'Weltmeisterschaft')}
  const st=standings(g,ctx.disc);const k=st.findIndex(o=>o.id===c.id);const rem=remaining(g,ctx.disc);
  if(k>=0&&k<3&&st[0]&&st[0].pts-st[k].pts<=rem*100&&rem<=4){p+=1.5;r.push('Kampf um die Kugel')}
  if(run===2&&ctx.r1){const m=ctx.r1.findIndex(y=>isMe(y.id));if(m>=0&&m<3){p+=1;r.push(m===0?'Führung nach Lauf 1':'Podest in Reichweite')}}
  if(run===1&&ctx.two){const wc=(c.ach&&c.ach.points);if(!wc){p+=0.5;r.push('erste Punkte möglich')}}
  if(c.rival&&ctx.ids.includes(c.rival)){p+=0.5;r.push('Rivale am Start')}
  if(hunted(g,ctx.disc)){p+=1;r.push('Gejagte:r – alle wollen dich schlagen')}
  return{p:Math.min(4,p),r};
}
function pressPen(ctx,run){const c=C();const{p}=pressure(ctx,run);return p*0.03*clamp(1-(c.mental-50)/50,0,1.6)*(hasPerk('nerve')?0.5:1)*(hasPerk('focus')?0.5:1)}

function ecRace(disc){
  const c=C();const a=BYID[c.id];c.ec=c.ec||{pts:{DH:0,SG:0,GS:0,SL:0},wins:0};
  const me=a.r[disc]+(S[c.g].form[a.id]||0)-Math.max(0,c.fat-35)*0.07+gauss()*3;
  if(rnd()<DNFP[disc]*1.1)return{st:'DNF'};
  let rk=1;for(let k=0;k<55;k++){if(70+gauss()*4.2+gauss()*3>me)rk++}
  const pts=rk<=30?PTS[rk-1]:0;c.ec.pts[disc]+=pts;if(rk===1)c.ec.wins++;return{rk,pts};
}

function simWins(id){return (S.cw&&S.cw[id])||0}
function recTable(g){const R=SEEDREC[g];const out={};
  let bw={n:R.wins[0],v:R.wins[1]};ATH[g].forEach(a=>{const v=a.me?C().wins:(BASEW[a.name]||0)+simWins(a.id);if(v>bw.v)bw={n:a.name,v}});(S.retW&&S.retW[g]||[]).forEach(x=>{if(x.v>bw.v)bw=x});out.wins=bw;

  let bo={n:R.overall[0],v:R.overall[1]};ATH[g].forEach(a=>{const v=(BASEO[a.name]||0)+((S.co&&S.co[a.id])||0);if(v>bo.v)bo={n:a.name,v}});out.overall=bo;return out}

// ---------- Pistengrafik mit Skifahrer ----------
function runSvg(p,names){
  const P=[[34,22],[206,62],[38,108],[204,150],[120,190]];
  const len=[0];for(let i=1;i<P.length;i++)len.push(len[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const tot=len[4];
  const k=Math.min(p.k,3),hist=p.hist||[],crash=hist.length&&hist[hist.length-1].crash;
  const from=len[k]/tot,to=len[Math.min(k+1,4)]/tot;const seg=P[Math.min(k+1,4)][0]-P[k][0];const dir=seg<0?-1:1;
  const path='M'+P.map(x=>x.join(',')).join(' L');
  // Tore entlang der Strecke (abwechselnd rot/blau)
  let gates='';let gi=0;for(let s=0;s<4;s++){const[a,b]=[P[s],P[s+1]];for(const f of [0.28,0.5,0.72]){const x=a[0]+(b[0]-a[0])*f,y=a[1]+(b[1]-a[1])*f;const col=gi++%2?'#1f6fd6':'#E10A2B';const off=(s%2?-1:1)*7;
    gates+=`<g transform="translate(${(x+off).toFixed(1)},${y.toFixed(1)})"><line x1="0" y1="0" x2="0" y2="-9" stroke="#5a6b7d" stroke-width="0.9"/><path d="M0,-9 L6,-7.5 L0,-5 Z" fill="${col}"/></g>`}}
  const trees=[[10,60],[14,140],[8,190],[230,30],[228,105],[232,185],[18,98],[226,145]].map(([x,y],i)=>`<g transform="translate(${x},${y}) scale(${0.8+(i%3)*0.15})"><path d="M0,-14 L7,0 L-7,0 Z" fill="#1d5c46"/><path d="M0,-20 L5,-8 L-5,-8 Z" fill="#256f55"/><rect x="-1" y="0" width="2" height="3" fill="#5b3b25"/></g>`).join('');
  const mk=[1,2,3].map(j=>{const h=hist[j-1];const cur=j===k+1&&!crash;const col=h?((h.d!=null?h.d<0:h.ok)?'#22C55E':'#FF5A5F'):cur?'#FFC93C':'#9FB3CC';

const LVLN={WC:'Weltcup',EC:'Europacup',FIS:'FIS-Rennen',JWM:'Junioren-WM',WM:'Großereignis'};
function resScore(e){if(!e.rk)return -1;const base={WM:100,WC:100,EC:55,JWM:50,FIS:25}[e.l]||0;return base-e.rk*(e.l==='FIS'?0.6:1)+(e.l==='WM'&&e.rk<=3?30:0)+(e.l==='JWM'&&e.rk<=3?10:0)}
function resTxt(e){const where=e.l==='WM'?`${e.ev} (${esc(e.v.replace(e.ev+' ',''))})`:e.l==='JWM'?'Junioren-WM':`${esc(e.v)} (${LVLN[e.l]})`;
  const pl=e.rk?(e.l==='WM'||e.l==='JWM')&&e.rk<=3?['🥇 Gold','🥈 Silber','🥉 Bronze'][e.rk-1]:e.rk===1?'🏆 Sieg':`${e.rk}. Platz`:e.st==='DNQ'?'nicht qualifiziert':'Ausfall';
  return `${pl} · ${DN[e.d]} – ${where}`}
function revData(c){const R=(c.sres||[]).filter(e=>e.l!=='INJ');const inj=(c.sres||[]).filter(e=>e.l==='INJ');
  const best=R.filter(e=>e.rk).sort((a,b)=>resScore(b)-resScore(a))[0]||null;
  let bitter=null;const bigInj=inj.slice().sort((a,b)=>b.sev-a.sev)[0];
  if(bigInj&&bigInj.sev>=2)bitter={i:'🚑',t:`${bigInj.t} in ${esc(bigInj.v)} – ca. ${bigInj.n} Rennen Pause`};
  else{const f4=R.filter(e=>e.rk===4&&(e.l==='WC'||e.l==='WM'))[0];const dnfs=R.filter(e=>!e.rk&&e.st!=='DNQ'&&(e.l==='WC'||e.l==='WM'));const dnq=R.filter(e=>e.st==='DNQ');
    if(f4)bitter={i:'😖',t:`${resTxt(f4)} – Holzmedaille, knapp am Podest vorbei`};
    else if(bigInj)bitter={i:'🚑',t:`${bigInj.t} in ${esc(bigInj.v)}`};
    else if(dnfs.length)bitter={i:'💥',t:`${dnfs.length>1?dnfs.length+' Ausfälle, zuerst ':'Ausfall '}im ${DN[dnfs[0].d]} von ${esc(dnfs[0].v)}`};
    else if(dnq.length)bitter={i:'❌',t:`${dnq.length}× nicht für den 2. Lauf qualifiziert`};
    else{const w=R.filter(e=>e.rk).sort((a,b)=>resScore(a)-resScore(b))[0];if(w&&w!==best)bitter={i:'😕',t:resTxt(w)}}}

function breakCard(){

  on('[data-go]',e=>{const[t,sb]=e.dataset.go.split(':');TAB=t;if(sb)SUBT[t]=sb;if(t==='races')RV='list';render();window.scrollTo(0,0)});
  on('[data-goal]',e=>{CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF.goal=e.dataset.goal;render()});
  on('[data-leg]',e=>{CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF.leg=!CF.leg;render()});
  on('[data-diff]',e=>{CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF.diff=e.dataset.diff;render()});
  on('[data-tsec]',e=>{trainSection(e.dataset.tsec);save();render()});
  on('[data-wax]',e=>{C().lastWax=e.dataset.wax;render()});
  on('[data-setup]',e=>{C().lastSetup=e.dataset.setup;render()});
  on('[data-ev]',e=>resolveEvent(+e.dataset.ev));
  on('[data-perk]',e=>buyPerk(e.dataset.perk));
  on('[data-camp]',e=>{C().summer.camp=e.dataset.camp;render()});
  on('[data-sfocus]',e=>{C().summer.focus=e.dataset.sfocus;render()});
  on('[data-hire]',e=>hire(e.dataset.hire));
  on('[data-buy]',e=>buyItem(e.dataset.buy));
  on('[data-pick]',e=>{drawPick(+e.dataset.pick);save();render()});
  on('[data-sell]',e=>{if(e.dataset.arm)sellItem(e.dataset.sell);else{e.dataset.arm=1;e.textContent='Sicher? Nochmal tippen'}});
  on('[data-fire]',e=>fire(e.dataset.fire));
  on('[data-sign]',e=>signSponsor(+e.dataset.sign));
  on('[data-world]',e=>{CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;CF.world=e.dataset.world;render()});
  on('[data-act]',e=>{const a=e.dataset.act;
    if(a==='next')goNext();if(a==='one')oneRace();if(a==='live')goLive();if(a==='sim')oneRace();
    if(a==='faster'&&LIVE)LIVE.speed=Math.max(80,LIVE.speed/2);
    if(a==='skip'&&LIVE){clearTimeout(LIVE.timer);LIVE=null;render()}
    if(a==='season')nextSeason();if(a==='endday')endDay();if(a==='timingstart')startTiming();if(a==='timing')stopTiming();if(a==='newskis')newSkis();if(a==='tosetup'){toSetup();save();render()}if(a==='gosetup'){confirmSetup();save();render();window.scrollTo(0,0)}if(a==='summer')finishSummer();if(a==='brk')continueBreak();if(a==='egoview'){C().view=C().view==='map'?'ego':'map';save();render()}if(a==='egoskip'){EGO.end=null;clearTimeout(EGO.tm);render()}if(a==='drawdone'){afterDraw(S.pend.ctx);save();render();window.scrollTo(0,0)}
    if(a==='cereok'){S.cere=null;TAB='home';save();render();window.scrollTo(0,0)}if(a==='cereres'){const e=S.cere;S.cere=null;if(!e.wm){SEL[e.g]=e.i;TAB='races';SUBT.races='cal';RV='detail'}else{TAB='races';SUBT.races='wm'}save();render();window.scrollTo(0,0)}if(a==='secauto'){let n=0;while(S.pend&&n++<10)resolveSection('ctrl');save();render()}if(a==='autoreha')autoRehab();
    if(a==='newcareer'){CF.name=$('#cfName').value;CF.nat=$('#cfNat').value;newCareer();TAB='home';render()}
    if(a==='retire'){if(e.dataset.arm)retireCareer();else{e.dataset.arm=1;e.textContent='⚠ Wirklich beenden? Nochmal klicken'}}
    if(a==='wipe'){if(e.dataset.arm){S=fresh();rebuild();ensureDepth();initReal();render()}else{e.dataset.arm=1;e.textContent='⚠ Alles löschen? Nochmal klicken'}}});
  const aq=$('#aq');if(aq){aq.oninput=()=>{AFILT=aq.value;const p=aq.selectionStart;render();const n=$('#aq');n.focus();n.setSelectionRange(p,p)};$('#an').onchange=e=>{NTAB=e.target.value;render()}}
  const cn=$('#cfName');if(cn)cn.oninput=()=>CF.name=cn.value;
}
function stopLive(){if(LIVE){clearTimeout(LIVE.timer);LIVE=null}}
document.addEventListener('keydown',e=>{if(TIMING&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();stopTiming()}});
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
function initReal(){save()} // Saison beginnt beim ersten Rennen (Sölden), nichts vorab simuliert
S=load();
if(S&&!S.ath)S=null;
if(!S){S=fresh();rebuild();ensureDepth();S.prevPts={M:estPrev('M'),W:estPrev('W')};initReal()}else{rebuild();if(ensureDepth())save()}
if(!S.prevPts)S.prevPts={M:estPrev('M'),W:estPrev('W')};
migrateCareer();if(S.pend&&S.pend.kind!=='run')S.pend=null;
render();

</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
